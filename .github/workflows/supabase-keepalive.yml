name: Supabase keep-alive

on:
  schedule:
    - cron: "17 3,15 * * *" # 00:17 e 12:17 BRT
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Real DB query via PostgREST (public RPC)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl -fsS --retry 3 --retry-delay 5 -m 20 -X POST \
            "$SUPABASE_URL/rest/v1/rpc/get_public_deliverable" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"slug_value":"keepalive-ping"}'
