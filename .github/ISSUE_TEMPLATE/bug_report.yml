name: Relatar um erro
description: Informe um comportamento reproduzível sem compartilhar dados sensíveis.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por ajudar. Para vulnerabilidades, use a aba **Security**, não este formulário.
  - type: textarea
    id: description
    attributes:
      label: O que aconteceu?
      description: Explique o resultado atual e o resultado esperado.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Como reproduzir?
      placeholder: |
        1. Abra...
        2. Clique...
        3. Observe...
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Ambiente
      options:
        - Modo demonstração
        - Instalação local
        - VPS com Docker
        - Vercel e Supabase
        - Outro
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão ou commit
      placeholder: "Ex.: main, v0.1.0 ou SHA do commit"
  - type: textarea
    id: evidence
    attributes:
      label: Evidências sem dados sensíveis
      description: Remova tokens, IDs, usernames, comentários reais e chaves antes de colar qualquer log.
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmações
      options:
        - label: Procurei por issues semelhantes.
          required: true
        - label: Removi segredos e dados pessoais.
          required: true
